name: Website Quality Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: website-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 22.14.0
          cache: npm

      - name: Install exact dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Dependency security audit
        run: npm audit --audit-level=high

      - name: Build production site
        run: npm run build

      - name: Verify production output
        run: npm run verify

      - name: Measure pull-request Lighthouse performance
        if: github.event_name == 'pull_request'
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/battlereef-preview.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill $PREVIEW_PID || true' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/ > /dev/null; then
              break
            fi
            sleep 1
          done
          set +e
          npx --yes @lhci/cli@0.15.1 autorun --config=lighthouserc.pr.json
          LH_STATUS=$?
          set -e
          node scripts/print-lighthouse-summary.mjs .lighthouseci
          exit $LH_STATUS
